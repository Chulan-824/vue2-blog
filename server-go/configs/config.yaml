server:
  host: "0.0.0.0"
  port: 8080

database:
  uri: "mongodb://localhost:27017"
  db_name: "blog"

jwt:
  secret: "your-jwt-secret-key-change-in-production"
  token_expires: "24h"
  refresh_expires: "168h" # 7 days

upload:
  path: "./public"
  base_url: "http://localhost:8080"

log:
  level: "info"
  format: "json"